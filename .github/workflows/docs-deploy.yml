name: Deploy docs to GitHub Pages

# Builds and publishes the documentation portal (docs-site, VitePress) when it changes on master.
# Build and deploy run in a single job (one runner instead of two). The build fails on dead
# internal links, so a broken portal is never published.
# Repository setting required once: Settings > Pages > Build and deployment > Source = "GitHub Actions".
on:
  push:
    branches: [master]
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

# Minimal permissions for Pages deployments with the built-in GITHUB_TOKEN.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Install
        run: npm ci
        working-directory: docs-site
      - name: Build (fails on dead links)
        run: npm run docs:build
        working-directory: docs-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/.vitepress/dist
      - id: deployment
        uses: actions/deploy-pages@v4
