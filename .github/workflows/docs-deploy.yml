name: Deploy docs to GitHub Pages

# Publishes the documentation portal (docs-site, VitePress) after every push to master.
# Repository setting required once: Settings > Pages > Build and deployment > Source = "GitHub Actions".
on:
  push:
    branches: [master]
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

# Minimal permissions for Pages deployments with the built-in GITHUB_TOKEN.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build (fails on dead links)
        run: npm run docs:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/.vitepress/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
