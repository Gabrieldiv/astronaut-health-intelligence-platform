name: CI

# Validates the app and the documentation portal on every push and pull request to master.
# A failing job blocks the merge (when branch protection requires this check).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Unit and scenario tests
        run: npm test
      - name: Production build
        run: npx vite build

  docs:
    name: Docs portal (build and dead link check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      # VitePress fails the build on dead internal links.
      - name: Build
        run: npm run docs:build
