name: CI

# App checks. Runs only when the app (or this workflow) changes: pushes that touch only the
# README, the spec, docs/ or the documentation portal do not start it.
on:
  push:
    branches: [master]
    paths:
      - 'frontend/web/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master, develop]
    paths:
      - 'frontend/web/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

# A newer push to the same branch cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      # oxlint: errors fail the job; warnings are reported only.
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc -b
      - name: Unit and scenario tests
        run: npm test
      - name: Production build
        run: npx vite build

  e2e:
    name: End to end (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Functional tests only: visual snapshots are platform specific (baselines are generated on
      # Windows) and are skipped on Linux unless E2E_VISUAL=1. See playwright.config.ts.
      - name: End to end tests
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/web/playwright-report/
            frontend/web/test-results/
          retention-days: 7
