name: Deploy (Vercel)

# Production deploy of the web app to Vercel (team weft-systems, project astronaut-health-intelligence).
# The Vercel project is NOT connected to this GitHub repo, so this workflow deploys with the Vercel CLI.
# Requires one repository secret: VERCEL_TOKEN (Vercel, Account Settings, Tokens, scope: Weft Systems).
# The org and project ids are identifiers, not secrets.
on:
  push:
    branches: [master]
    paths:
      - 'frontend/web/**'
      - '.github/workflows/deploy-vercel.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never run two production deploys at once; let the running one finish.
concurrency:
  group: deploy-vercel
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_5ylFINJ3wjlAVjwz02juHdqy
  VERCEL_PROJECT_ID: prj_C9TbHItMRwOuss8gBuCvyCF2oP8U

jobs:
  deploy:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Install Vercel CLI
        run: npm install --global vercel@65.16.0
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
